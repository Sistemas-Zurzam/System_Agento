name: CI

# Pruebas del backend. Se ejecutan en cada PR y las reutilizan los workflows de
# despliegue (staging y producción). No existe ninguna forma de omitirlas: si
# fallan, el despliegue no empieza.
on:
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "agento-backend/**"
      - ".github/workflows/**"
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: agento-backend

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute tests (Unit and Feature)
        run: php artisan test
