name: Deploy production

# Despliegue a PRODUCCIÓN al integrar en `main`.
# Condiciones para que llegue al servidor:
#   1. Las pruebas (ci.yml) pasan.
#   2. Un revisor aprueba manualmente: el GitHub Environment "production" debe
#      tener "Required reviewers" (ver docs/runbooks/despliegue.md).
#   3. El respaldo de la base se genera y verifica en el servidor; si falla, se aborta.
on:
  push:
    branches: ["main"]
    paths:
      - "agento-backend/**"
      - "agento-frontend/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    # Interruptor de seguridad adicional a la aprobación manual: sin PRODUCTION_DEPLOY_ENABLED=true un push
    # a `main` solo ejecuta las pruebas. Si el Environment "production" no tuviera revisores obligatorios,
    # GitHub desplegaría sin pedir aprobación; esto evita ese caso hasta que se active a propósito.
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ vars.APP_DIR || '/var/www/System-Agento' }}
          DEPLOY_BRANCH: main
          ENTORNO: production
          MAINTENANCE_SECRET: ${{ secrets.MAINTENANCE_SECRET }}
          BACKUP_DIR: ${{ vars.BACKUP_DIR }}
          BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_DIR,DEPLOY_BRANCH,ENTORNO,MAINTENANCE_SECRET,BACKUP_DIR,BACKUP_RETENTION_DAYS
          script_stop: true
          script: |
            set -euo pipefail
            cd "$APP_DIR"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git show "origin/$DEPLOY_BRANCH:agento-backend/deploy/scripts/deploy.sh" > /tmp/agento-deploy.sh
            bash /tmp/agento-deploy.sh

      - name: Smoke test (health check)
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            "${{ vars.HEALTHCHECK_URL }}"
